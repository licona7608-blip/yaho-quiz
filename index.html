<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 야호 실시간 퀴즈 대결 (학생용)</title>
    <style>
        :root { --primary: #8b5cf6; --primary-hover: #7c3aed; --bg: #f3f4f6; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 500px; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        h1 { color: #1f2937; margin-bottom: 10px; font-size: 28px; }
        p { color: #6b7280; margin-bottom: 30px; }
        
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* 캐릭터 목록 그리드 */
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .avatar-btn { font-size: 40px; background: #f3f4f6; border: 3px solid #e5e7eb; border-radius: 18px; padding: 10px; cursor: pointer; transition: all 0.2s; }
        .avatar-btn:hover { background: #e0e7ff; border-color: var(--primary); transform: scale(1.05); }
        .avatar-btn.taken { opacity: 0.2; pointer-events: none; background: #d1d5db; border-color: #9ca3af; }
        
        /* 대기실 디자인 */
        .lobby-box { background: #f9fafb; padding: 20px; border-radius: 18px; border: 2px solid #e5e7eb; margin-bottom: 20px; }
        .lobby-avatar { font-size: 70px; margin-bottom: 10px; }
        .name-input-group { display: flex; gap: 10px; margin-top: 15px; }
        .name-input { flex: 1; padding: 12px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 16px; text-align: center; }
        .name-input:focus { border-color: var(--primary); outline: none; }
        .name-btn { width: auto; padding: 12px 20px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        .player-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
        .player-card { background: #f3f4f6; padding: 12px; border-radius: 14px; font-weight: bold; font-size: 14px; }
        .player-avatar { font-size: 30px; margin-bottom: 3px; }
        
        /* 퀴즈 정답 버튼 */
        .quiz-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #111827; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .opt-btn { background: #f3f4f6; color: #1f2937; border: 2px solid #e5e7eb; border-radius: 14px; text-align: left; padding: 18px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .opt-btn:hover { background: #e5e7eb; }
        .ox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .ox-btn { font-size: 60px; height: 150px; text-align: center; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: #f3f4f6; border: 2px solid #e5e7eb; cursor: pointer; }
        .ox-btn:hover { background: #e5e7eb; }
        .submitted-msg { font-size: 20px; color: #059669; font-weight: bold; margin-top: 50px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1단계: 캐릭터(아바타) 선택 화면 -->
    <div id="join-screen" class="screen active">
        <h1>🐯 나만의 캐릭터 선택</h1>
        <p>친구들이 선택하지 않은 귀여운 캐릭터를 골라주세요!</p>
        <div class="avatar-grid" id="avatar-selector"></div>
        <p style="font-size: 12px; color: #9ca3af;">* 이미 누군가 고른 캐릭터는 투명하게 변해 고를 수 없습니다.</p>
    </div>

    <!-- 2단계: 실시간 대기방 & 내 이름 바꾸기 -->
    <div id="lobby-screen" class="screen">
        <h1>👥 실시간 대기방</h1>
        <div class="lobby-box">
            <div class="lobby-avatar" id="my-avatar-display">🐯</div>
            <p style="margin: 0; font-size: 14px; color: #6b7280;">바른 우리 반 이름을 입력해 주세요.</p>
            <div class="name-input-group">
                <input type="text" class="name-input" id="nickname-input-lobby" placeholder="예: 3번 홍길동" />
                <button class="name-btn" onclick="renameStudent()">이름 저장</button>
            </div>
        </div>
        <p id="lobby-status" style="font-weight: bold; color: var(--primary);">선생님이 대회를 시작하면 자동으로 이동합니다!</p>
        <div class="player-grid" id="player-list"></div>
    </div>

    <!-- 3단계: 실시간 퀴즈 화면 -->
    <div id="play-screen" class="screen">
        <div class="quiz-title" id="quiz-text">질문 준비 중...</div>
        <div id="quiz-content"></div>
    </div>

    <!-- 4단계: 정답 제출 완료 대기 화면 -->
    <div id="submitted-screen" class="screen">
        <div class="submitted-msg">🟢 제출이 완료되었습니다!</div>
        <p>친구들이 다 풀거나 선생님이 넘겨줄 때까지 기다려 주세요.</p>
    </div>

    <!-- 5단계: 실시간 점수판 및 시상대 -->
    <div id="leaderboard-screen" class="screen">
        <h1 id="leaderboard-title">📊 현재 실시간 점수판</h1>
        <p>친구들의 성적을 확인해 보세요!</p>
        <div id="leaderboard-list"></div>
    </div>
</div>

<script>
    // =======================================================
    // ⚙️ ✨ [파이소켓 키 입력 부분] ✨
    // =======================================================
    const clusterId = "free.blr2";  // 👈 대시보드에서 복사한 Cluster ID 입력
    const apiKey = "k0tjrwgSEV54W6TclItbi4rFVbcF3KhofYoQDuav";        // 👈 대시보드에서 복사한 API Key 입력
    const channelId = "yaho-quiz-room";   

    const allAvatars = ["🐯", "🦊", "🐰", "🐻", "🐼", "🐨", "🦁", "🐸", "🐵", "🐔", "🐧", "🦉"];
    let takenAvatars = [];
    let socket;
    let myAvatar = "";
    let myName = "";
    
    let currentRoundLocal = -1;
    let hasSubmittedLocal = false;

    // 페이지 열리자마자 백그라운드 클라우드 안테나 자동 수신 시작
    window.onload = () => {
        connectWebSocket();
    };

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId + '-screen').classList.add('active');
    }

    function connectWebSocket() {
        const url = `wss://${clusterId}.piesocket.com/v3/${channelId}?api_key=${apiKey}&notify_self=0`;
        socket = new WebSocket(url);

        socket.onmessage = (event) => {
            const parts = event.data.split('|');
            const header = parts[0];

            if (header === "SYNC_LOBBY") {
                if (parts.length > 7) {
                    updatePlayersAndAvatars(parts[7]);
                }
            } 
            else if (header === "SYNC_PLAY") {
                const round = parseInt(parts[1]);
                const type = parts[2];
                const text = parts[3];
                const options = parts[4] ? parts[4].split(',') : [];
                
                if (currentRoundLocal !== round) {
                    currentRoundLocal = round;
                    hasSubmittedLocal = false;
                }

                if (!hasSubmittedLocal) {
                    showScreen('play');
                    renderQuestion(type, text, options);
                }
                if (parts.length > 7) updatePlayersAndAvatars(parts[7]);
            } 
            else if (header === "SYNC_LEADERBOARD") {
                showScreen('leaderboard');
                document.getElementById('leaderboard-title').innerText = "📊 중간 순위판";
                if (parts.length > 7) renderLeaderboard(parts[7]);
            }
            else if (header === "SYNC_FINAL") {
                showScreen('leaderboard');
                document.getElementById('leaderboard-title').innerText = "🏆 최종 시상대 🏆";
                if (parts.length > 7) renderLeaderboard(parts[7]);
            }
            else if (header === "REQ_RENAME") {
                // 🚨 선생님이 "이름 변경해라!" 하고 레이더를 날렸을 때 반응
                const targetAvatar = parts[1];
                if (myAvatar === targetAvatar) {
                    alert("🚨 선생님이 올바른 이름으로 변경을 요청하셨습니다! 바른 실명으로 변경해 주세요.");
                    const nameField = document.getElementById('nickname-input-lobby');
                    nameField.focus();
                    nameField.style.borderColor = "red";
                    nameField.value = "";
                }
            }
            else if (header === "RESET") {
                // ⏰ 30초가 지나 게임이 폭파되면 전체 동시 리셋
                alert("⏰ 게임이 종료되어 메인 화면으로 돌아갑니다.");
                location.reload();
            }
        };

        // 첫 가동 시 아바타 격자 화면 그리기
        renderAvatarSelector();
    }

    function renderAvatarSelector() {
        const grid = document.getElementById('avatar-selector');
        grid.innerHTML = "";
        allAvatars.forEach(av => {
            const isTaken = takenAvatars.includes(av);
            const btnClass = isTaken ? "avatar-btn taken" : "avatar-btn";
            grid.innerHTML += `<button class="${btnClass}" onclick="selectAvatar('${av}')">${av}</button>`;
        });
    }

    function selectAvatar(avatar) {
        if (takenAvatars.includes(avatar)) return;
        myAvatar = avatar;
        myName = "익명의 " + avatar;
        
        // 1. 클라우드에 "나 이 캐릭터로 들어간다!" 신호 송출
        socket.send(`JOIN|${avatar}`);
        
        // 2. 대기실 내 화면 준비
        document.getElementById('my-avatar-display').innerText = avatar;
        document.getElementById('nickname-input-lobby').value = "";
        showScreen('lobby');
    }

    function renameStudent() {
        const input = document.getElementById('nickname-input-lobby');
        if (!input.value.trim()) { alert("바른 이름을 입력해 주세요!"); return; }
        myName = input.value.trim();
        input.style.borderColor = "#e5e7eb"; // 원래 색상 복구
        
        // 선생님 패드에 이름 변경 패킷 송신
        socket.send(`RENAME|${myAvatar}|${myName}`);
        alert("이름이 정상적으로 저장되었습니다!");
    }

    function sendAnswer(answer) {
        if (hasSubmittedLocal) return;
        hasSubmittedLocal = true;
        // 아바타 기준으로 정답 제출 식별
        socket.send(`SUBMIT|${myAvatar}|${answer}`);
        showScreen('submitted');
    }

    function renderQuestion(type, text, options) {
        document.getElementById('quiz-text').innerText = text;
        const container = document.getElementById('quiz-content');
        container.innerHTML = "";

        if (type === "OX") {
            container.className = "ox-grid";
            container.innerHTML = `<button class="ox-btn" onclick="sendAnswer('0')">⭕</button><button class="ox-btn" onclick="sendAnswer('1')">❌</button>`;
        } else if (type === "4지선다") {
            container.className = "options-grid";
            options.forEach((opt, idx) => {
                container.innerHTML += `<button class="opt-btn" onclick="sendAnswer('${idx}')">${idx+1}. ${opt}</button>`;
            });
        } else if (type === "단답형") {
            container.className = "";
            container.innerHTML = `<input type="text" id="short-answer" placeholder="정답을 입력하세요" style="width:100%; padding:15px; border-radius:10px; border:2px solid #e5e7eb; margin-bottom:15px; text-align:center; font-size:16px;"/><button onclick="sendAnswer(document.getElementById('short-answer').value)">정답 제출하기 ➡️</button>`;
        }
    }

    function updatePlayersAndAvatars(jsonStr) {
        try {
            const players = JSON.parse(jsonStr);
            
            // 실시간으로 선점된 캐릭터 목록을 갱신
            takenAvatars = players.filter(p => !p.isTeacher).map(p => p.avatar);
            
            // 만약 캐릭터 선택창에 머무는 상태라면 격자판 실시간 새로고침
            if (document.getElementById('join-screen').classList.contains('active')) {
                renderAvatarSelector();
            }

            // 대기실 리스트 화면 갱신
            const container = document.getElementById('player-list');
            container.innerHTML = "";
            players.forEach(p => {
                if(!p.isTeacher) { 
                    container.innerHTML += `<div class="player-card"><div class="player-avatar">${p.avatar}</div><div>${p.name}</div></div>`; 
                }
            });
        } catch (e) {}
    }

    function renderLeaderboard(jsonStr) {
        try {
            const players = JSON.parse(jsonStr).filter(p => !p.isTeacher);
            const container = document.getElementById('leaderboard-list');
            container.innerHTML = "";
            players.forEach((p, idx) => {
                container.innerHTML += `<div class="player-card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; text-align:left;"><span><strong>${idx+1}등</strong> ${p.avatar} ${p.name}</span><span style="color:var(--primary); font-weight:bold;">${p.score}점</span></div>`;
            });
        } catch (e) {}
    }
</script>
</body>
</html>
